<div class="shell">
  <header class="topbar">
    <div class="brand">Job Portal</div>
    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/companies" routerLinkActive="active">Companies</a>
      <a routerLink="/cv" routerLinkActive="active">CV &amp; Skills</a>
    </nav>
    <div class="account">
      <app-usage-badge />
      <span class="email">{{ email }}</span>
      <button class="btn" (click)="signOut()">Sign out</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
